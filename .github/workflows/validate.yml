name: Project Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Aurift Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required project files
        shell: bash
        run: |
          required_files=(
            "index.html"
            "css/style.css"
            "js/main.js"
            "js/scene.js"
            "ember/index.html"
            "forge/index.html"
            "README.md"
            "CONTRIBUTING.md"
            "LICENSE"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file is missing: $file"
              exit 1
            fi

            if [ ! -s "$file" ]; then
              echo "::error file=$file::Required file is empty: $file"
              exit 1
            fi

            echo "✓ $file"
          done

      - name: Validate main JavaScript syntax
        run: |
          node --check js/main.js

      - name: Validate Three.js module syntax
        run: |
          node --input-type=module --check < js/scene.js

      - name: Verify main HTML structure
        shell: bash
        run: |
          grep -qi '<!doctype html' index.html || {
            echo "::error file=index.html::Missing HTML doctype"
            exit 1
          }

          grep -q 'id="hero-canvas"' index.html || {
            echo "::error file=index.html::Hero canvas was not found"
            exit 1
          }

          echo "✓ Main HTML structure verified"

      - name: Validation complete
        run: |
          echo "Aurift Studio validation passed."
